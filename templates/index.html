{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SwaML AutoML - No Code ML</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
</head>
<body>
    <header>
        <h1>SwaML AutoML</h1>
        <p>Zero-Code Machine Learning. Upload CSV → Detect Target → Train.</p>
    </header>

    <main>
        <!-- Upload & Train Section -->
        <section class="section">
            <h2>Start New Training</h2>
            <div class="upload-box">
                <input type="file" id="csvFile" accept=".csv" required />
                <button id="startBtn">
                    <span>🚀</span> Upload & Analyze
                </button>
            </div>

            <!-- Loading State -->
            <div class="loading hidden" id="loading">
                Processing your data... Please wait.
            </div>

            <!-- Upload Info -->
            <div id="uploadInfo" class="hidden" style="margin-top: 20px;">
                <p><strong>File:</strong> <span id="uploadedFileName"></span></p>
            </div>

            <!-- Preview Table -->
            <div id="initialPreview" class="table-container"></div>

            <!-- Target Confirmation -->
            <div id="targetConfirm" class="success-box hidden" style="margin-top: 30px;">
                <h3>🎯 Target Column Detected</h3>
                <p style="margin-bottom: 15px;">We detected <strong id="detectedTargetText" style="color: var(--success); font-size: 1.1em;"></strong> as your target.</p>
                
                <label for="targetSelect" style="display:block; margin-bottom: 8px; font-weight:500;">Confirm or change target:</label>
                <select id="targetSelect"></select>
                
                <div style="margin-top: 20px; text-align: right;">
                    <button id="confirmTrainBtn">
                        Confirm & Start Training <span>⚡</span>
                    </button>
                </div>
            </div>

            <!-- Training Result -->
            <div id="trainResult" class="result-section" style="margin-top: 30px;"></div>
        </section>

        <!-- View Dataset Section -->
        <section class="section dataset-section">
            <h2>Explore Dataset</h2>
            <div class="dataset-controls">
                <div class="control-group">
                    <label for="rowLimit">Rows per page</label>
                    <input type="number" id="rowLimit" value="10" min="1" max="100" />
                </div>
                <div class="control-group">
                    <label for="offset">Start Row Offset</label>
                    <input type="number" id="offset" value="0" min="0" />
                </div>
                <button id="showDatasetBtn" style="height: 50px; align-self: end;">
                    View Data <span>📊</span>
                </button>
            </div>
            <div id="datasetResult" class="table-container"></div>
        </section>
    </main>

    <script src="{% static 'js/app.js' %}"></script>
</body>
</html>
